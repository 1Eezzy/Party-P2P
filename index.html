<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; connect-src ws:; media-src 'self' blob: mediastream:; img-src 'self' data:">
  <title>Party P2P</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="workspace.css">
</head>
<body>
  <section id="login">
    <form id="lf">
      <h1>Party P2P</h1>
      <p class="dim">Voz e chat direto entre os membros, sem servidor de mídia no meio.</p>
      <div class="tabs">
        <button type="button" data-tab="join" class="on">Entrar numa party</button>
        <button type="button" data-tab="host">Criar party</button>
      </div>
      <input id="nick" placeholder="Seu apelido" maxlength="24" required>
      <input id="addr" placeholder="Endereço do host (ex.: 26.10.4.2:7777)" required>
      <input id="pname" placeholder="Nome da party" maxlength="30" hidden>
      <input id="port" type="number" value="7777" min="1024" max="65535" hidden>
      <input id="pass" type="password" placeholder="Senha da party">
      <button class="go" id="go">Entrar</button>
      <button type="button" id="login-settings">Configurações</button>
      <button type="button" id="login-update">Verificar atualizações</button>
      <p id="err"></p>
      <section id="recent-parties" hidden>
        <h2>Parties recentes</h2>
        <div id="recent-list"></div>
      </section>
    </form>
  </section>

  <main id="app" hidden>
    <aside id="rail" aria-label="Navegação principal"></aside>
    <header id="workspace-topbar"><div class="workspace-location"><span class="breadcrumb">WORKSPACE</span><strong id="workspace-title">Visão geral</strong></div><label class="workspace-search"><span id="search-icon"></span><input id="workspace-search" type="search" placeholder="Buscar canais e pessoas" aria-label="Buscar canais e pessoas"><kbd>/</kbd></label><div id="global-call" hidden></div><button id="top-profile" title="Meu perfil"></button></header>
    <nav id="channel-sidebar">
      <div class="brand"><span class="brand-mark">P</span> Party <span class="brand-tag">P2P</span></div>
      <header id="ph"></header>
      <div id="side"></div>
      <div id="connection" role="status"><span class="signal-bars"><b></b><b></b><b></b></span><span id="connection-label">Aguardando conexão</span></div>
      <footer id="me">
        <button id="my-profile" title="Abrir meu perfil"><i id="av"></i><span><strong id="mn"></strong><small>Meu perfil</small></span></button>
        <button id="audio-settings" title="Configurar e testar microfone" aria-label="Configurar e testar microfone">⚙</button>
        <button id="bm" title="Mutar microfone">🎙</button>
        <button id="bd" title="Ensurdecer">🎧</button>
        <button id="bl" class="bad" title="Sair da voz" hidden>☎</button>
      </footer>
    </nav>
    <section id="chat">
      <header id="head"></header>
      <div id="voice-members" hidden></div>
      <div id="stage" hidden></div>
      <div id="msgs"></div>
      <input id="txt" autocomplete="off" maxlength="2000">
    </section>
    <section id="workspace-page" aria-label="Conteúdo da aba"></section>
  </main>

  <div id="toasts"></div>
  <section id="floating-screen" hidden>
    <header id="floating-screen-title">Transmissão</header>
    <div id="floating-screen-video"></div>
    <div class="floating-actions"><button id="floating-full" title="Tela cheia">⛶</button><button id="floating-close" title="Voltar ao modo padrão">×</button></div>
  </section>
  <dialog id="dlg"></dialog>
  <dialog id="manage-dlg"></dialog>
  <script src="renderer.js"></script>
  <script src="workspace.js"></script>
</body>
</html>
